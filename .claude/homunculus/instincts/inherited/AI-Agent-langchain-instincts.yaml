# AI Agent Langchain Workflow Library Release Version Bump

## Action

Follow the library-release-version-bump workflow:
1. Update the version number in pyproject.toml for the relevant package.
2. Update the version number in __init__.py if present.
3. Update lock files (uv.lock) if dependencies are involved.
4. Summarize key changes in the commit message.

## Evidence

- Workflow detected from commit patterns
- Frequency: ~2x per month
- Files: libs/*/pyproject.toml, libs/*/__init__.py, libs/*/uv.lock

